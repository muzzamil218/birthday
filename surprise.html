<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise for Zunii! 🎁</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background"></div>
    
    <!-- Confetti Container -->
    <div class="confetti-container" id="confettiContainer"></div>
    
    <!-- Balloons -->
    <div class="balloon" style="--color: #FF6B6B; left: 10%; animation-delay: 0s;"></div>
    <div class="balloon" style="--color: #4ECDC4; left: 25%; animation-delay: 0.5s;"></div>
    <div class="balloon" style="--color: #FFE66D; left: 40%; animation-delay: 1s;"></div>
    <div class="balloon" style="--color: #95E1D3; left: 55%; animation-delay: 1.5s;"></div>
    <div class="balloon" style="--color: #F38181; left: 70%; animation-delay: 2s;"></div>
    <div class="balloon" style="--color: #AA96DA; left: 85%; animation-delay: 2.5s;"></div>
    
    <!-- Main Container -->
    <div class="container">
        <!-- Stars Background -->
        <div class="stars-container">
            <span class="star" style="left: 10%; top: 20%;"></span>
            <span class="star" style="left: 20%; top: 40%;"></span>
            <span class="star" style="left: 70%; top: 30%;"></span>
            <span class="star" style="left: 80%; top: 50%;"></span>
            <span class="star" style="left: 15%; top: 70%;"></span>
            <span class="star" style="left: 85%; top: 20%;"></span>
        </div>
        
        <!-- Surprise Title -->
        <div class="text-wrapper">
            <h1 class="birthday-text">
                <span class="letter">S</span>
                <span class="letter">u</span>
                <span class="letter">r</span>
                <span class="letter">p</span>
                <span class="letter">r</span>
                <span class="letter">i</span>
                <span class="letter">s</span>
                <span class="letter">e</span>
            </h1>
        </div>
        
        <!-- Special Message -->
        <div class="zunii-container">
            <h2 class="zunii-text">
                <span class="z-letter">🎁</span>
                <span class="z-letter">F</span>
                <span class="z-letter">o</span>
                <span class="z-letter">r</span>
                <span class="z-letter">Y</span>
                <span class="z-letter">o</span>
                <span class="z-letter">u</span>
            </h2>
        </div>
        
        <!-- Gift Box -->
        <div class="cake-container">
            <div class="gift-box">
                <div class="gift-ribbon"></div>
                <div class="gift-bow"></div>
            </div>
        </div>
        
        <!-- Message -->
        <p class="message">🌟 You're amazing! Enjoy your special day! 🌟</p>
        
        <!-- Surprise Button -->
        <a href="index.html" class="surprise-button">Surprise Zunii</a>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
